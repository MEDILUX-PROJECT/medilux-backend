name: Build and Deploy medilux-server Docker Image

#on:
#  pull_request:
#    branches:
#      - dev
#    types: [closed]
on:
  push:
    branches:
      - feat/V1-docker

env:
  # ECR 관련 변수
  ECR_REGISTRY: 203918878480.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: medilux_project/moasis
  IMAGE_TAG: ${{ github.sha }}

  # CodeDeploy 관련 변수 (필요시 그대로 사용)
  CODE_DEPLOY_APP_NAME: medilux-app
  DEPLOYMENT_GROUP_NAME: medilux-app-deployment-group

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      # 필요한 설정 파일 생성 및 빌드 과정 (기존과 동일)
      - run: touch ./src/main/resources/application.properties
      - run: echo "${{ secrets.APPLICATION }}" > ./src/main/resources/application.properties
      - run: cat ./src/main/resources/application.properties

#      - name: Set up JDK 17
#        uses: actions/setup-java@v1
#        with:
#          java-version: 17
#
#      - name: Grant execute permission for gradlew
#        run: chmod +x gradlew
#
#      - name: Build with Gradle
#        run: ./gradlew clean build -x test

      # 도커 이미지 빌드를 위한 Dockerfile이 프로젝트 루트에 위치해야 함
      - name: Build Docker Image
        run: docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      # AWS ECR 로그인 (aws-actions/amazon-ecr-login 액션 사용)
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-2

      - name: Push Docker Image to ECR
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/medilux-server-keypair.pem ubuntu@3.35.57.138
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin $ECR_REGISTRY
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            docker stop my-container || true
            docker rm my-container || true
            docker run -d --name my-container -p 8080:8080 $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          EOF
        env:
          ECR_REGISTRY: 203918878480.dkr.ecr.ap-northeast-2.amazonaws.com
          ECR_REPOSITORY: medilux_project/moasis
          IMAGE_TAG: ${{ github.sha }}
